# XYZW 控制台 —— 生产环境 nginx 配置
#
# 由 vite.config.js 的 dev proxy 等价移植而来，7 条代理一条都不能少：
#   /auth            → 本机 3001（登录 / 白名单）
#   /api/pushing     → 本机 3001（后台推关，需要注入 x-api-key）
#   /frontend-log    → 本机 3001（前端埋点，十殿房间状态的数据来源）
#   /api/sync        → 本机 3001（跨端同步码）
#   /api/hortor-ucenter → 游戏 ucenter（手机号验证码，必须改写 Host）
#   /api/hortor      → 游戏 comb-platform（BIN 取角色）
#   /api/weixin      → 微信开放平台（扫码登录）
#   /api/weixin-long → 微信长轮询（扫码状态）
#
# 部署时替换两个占位符：__API_KEY__、__SERVER_NAME__

server {
    listen 80;
    listen 3000;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/xyzw;
    index index.html;

    # 埋点允许 1mb（后端 server.js 里已放宽），这里再留点余量
    client_max_body_size 8m;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/font-woff2;

    access_log /var/log/nginx/xyzw.access.log;
    error_log  /var/log/nginx/xyzw.error.log warn;

    # ---------- 静态资源 ----------
    # 打包产物带 hash，可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 本机后端 ----------
    location /auth {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 跨端同步码（只校验登录，不需要 x-api-key）
    location /api/sync {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/pushing {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 等价于 vite dev 里的 proxy.headers["x-api-key"]
        proxy_set_header x-api-key "__API_KEY__";
        # 推关状态查询偶尔较慢
        proxy_read_timeout 300s;
    }

    location /frontend-log {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ---------- 游戏 / 微信 第三方接口 ----------
    # 手机号验证码：必须把 Host 改成 ucenter-app-server，否则游戏方按未知来源拒绝
    location /api/hortor-ucenter/ {
        proxy_pass https://comb-platform.hortorgames.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host ucenter-app-server.hortorgames.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 12; ALN-AL80 Build/HUAWEIALN-AL80; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/114.0.5735.196 Mobile Safari/537.36";
        proxy_set_header Accept "application/json";
        proxy_set_header Content-Type "application/json; charset=utf-8";
    }

    # BIN 取角色
    location /api/hortor/ {
        proxy_pass https://comb-platform.hortorgames.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host comb-platform.hortorgames.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 12; 23117RK66C Build/V417IR; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/95.0.4638.74 Mobile Safari/537.36";
        proxy_set_header Accept "*/*";
        proxy_set_header Content-Type "text/plain; charset=utf-8";
        proxy_set_header Origin "https://open.weixin.qq.com";
        proxy_set_header Referer "https://open.weixin.qq.com/";
    }

    # 微信扫码登录（注意：/api/weixin-long 不会被这条匹配，见下一条）
    location /api/weixin/ {
        proxy_pass https://open.weixin.qq.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host open.weixin.qq.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 7.0; Mi-4c Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/53.0.2785.49 Mobile MQQBrowser/6.2 TBS/043632 Safari/537.36 MicroMessenger/6.6.1.1220(0x26060117) NetType/WIFI Language/zh_CN";
        proxy_set_header Accept "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8";
        proxy_set_header Referer "https://open.weixin.qq.com/";
    }

    # 微信扫码状态长轮询
    location /api/weixin-long/ {
        proxy_pass https://long.open.weixin.qq.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host long.open.weixin.qq.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 7.0; Mi-4c Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/53.0.2785.49 Mobile MQQBrowser/6.2 TBS/043632 Safari/537.36 MicroMessenger/6.6.1.1220(0x26060117) NetType/WIFI Language/zh_CN";
        proxy_set_header Accept "*/*";
        proxy_set_header Referer "https://open.weixin.qq.com/";
        proxy_read_timeout 120s;
    }
}
