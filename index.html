<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XYZW 游戏管理系统</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }

      #app {
        min-height: 100vh;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading">正在加载应用...</div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <!-- 游戏加密模块（window.__require）：必须是 public 下的静态文件，
         写成 /src/xyzw/* 时构建会丢弃这些 script，线上就没有 __require，
         刷新 Token / 手机号验证码 / BIN 获取都会报「游戏加密模块未加载」 -->
    <script type="module" src="/xyzw/cocos2d-js-min.js"></script>
    <script type="module" src="/xyzw/game-defines.js"></script>
    <script type="module" src="/xyzw/index.js"></script>
  </body>
</html>
